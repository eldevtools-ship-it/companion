name: Compagnon
options:
  bundleIdPrefix: com.eldevtools
  deploymentTarget:
    macOS: "15.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "6.0"
    ENABLE_HARDENED_RUNTIME: YES
    OTHER_SWIFT_FLAGS: "-strict-concurrency=complete"
    # Signature locale (« ad hoc ») : l'app ne sert que sur notre Mac,
    # pas besoin de compte développeur Apple.
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: "-"
    CODE_SIGNING_REQUIRED: NO
    CODE_SIGNING_ALLOWED: YES
    CODE_SIGN_INJECT_BASE_ENTITLEMENTS: NO
    CODE_SIGN_ENTITLEMENTS: Resources/Compagnon.entitlements

schemes:
  Compagnon:
    build:
      targets:
        Compagnon: all
    run:
      config: Debug
    archive:
      config: Release

targets:
  Compagnon:
    type: application
    platform: macOS
    sources:
      - path: Sources
        type: group
      - path: Assets.xcassets
        buildPhase: resources
      - path: Resources/sounds
        buildPhase: resources
        type: folder
    info:
      path: Resources/Info.plist
      properties:
        CFBundleName: Compagnon
        CFBundleDisplayName: Compagnon
        CFBundleIdentifier: com.eldevtools.Compagnon
        CFBundleVersion: "1"
        CFBundleShortVersionString: "0.1.0"
        CFBundlePackageType: APPL
        CFBundleDevelopmentRegion: fr
        LSUIElement: YES
        NSHighResolutionCapable: YES
        NSSupportsAutomaticGraphicsSwitching: YES
        NSAppleEventsUsageDescription: "Pour sauter au terminal, envoyer des mails et piloter Musique."
        NSAccessibilityUsageDescription: "Pour lire le titre de la fenêtre active et l'attacher comme contexte."
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.eldevtools.Compagnon
        PRODUCT_NAME: Compagnon
        INFOPLIST_FILE: Resources/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        MACOSX_DEPLOYMENT_TARGET: "15.0"
        ENABLE_SANDBOX: NO
        DEVELOPMENT_LANGUAGE: fr
