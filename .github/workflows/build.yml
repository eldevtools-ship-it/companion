name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Version d'Xcode
        run: xcodebuild -version

      - name: Installer XcodeGen
        run: brew install xcodegen

      - name: Générer le projet Xcode
        run: cd Compagnon && xcodegen

      - name: Tests (géométrie de l'écran, filtre de liens)
        run: |
          bash scripts/test-screen-geometry.sh
          bash scripts/test-safe-links.sh

      - name: Compiler
        run: |
          set -o pipefail
          xcodebuild \
            -project Compagnon/Compagnon.xcodeproj \
            -scheme Compagnon \
            -configuration Release \
            -derivedDataPath build \
            build > build.log 2>&1 && status=0 || status=$?
          grep -E "error:|BUILD (SUCCEEDED|FAILED)" build.log | sort -u || true
          exit $status

      - name: Signer (ad hoc) et zipper
        run: |
          APP=build/Build/Products/Release/Compagnon.app
          codesign --force --deep --options runtime \
            --entitlements Compagnon/Resources/Compagnon.entitlements -s - "$APP"
          codesign --verify --deep --strict "$APP"
          ditto -c -k --keepParent "$APP" Compagnon.zip

      - uses: actions/upload-artifact@v4
        with:
          name: Compagnon
          path: Compagnon.zip
          retention-days: 30

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: build-log
          path: build.log
