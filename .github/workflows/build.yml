name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Version d'Xcode
        run: xcodebuild -version

      - name: Installer XcodeGen
        run: brew install xcodegen

      - name: Générer le projet Xcode
        run: cd Kumo && xcodegen

      - name: Tests (géométrie de l'écran, filtre de liens)
        run: |
          bash scripts/test-screen-geometry.sh
          bash scripts/test-safe-links.sh

      - name: Compiler
        run: |
          set -o pipefail
          xcodebuild \
            -project Kumo/Kumo.xcodeproj \
            -scheme Kumo \
            -configuration Release \
            -derivedDataPath build \
            CURRENT_PROJECT_VERSION=${{ github.run_number }} \
            MARKETING_VERSION=0.1.${{ github.run_number }} \
            build > build.log 2>&1 && status=0 || status=$?
          grep -E "error:|BUILD (SUCCEEDED|FAILED)" build.log | sort -u || true
          exit $status

      - name: Signer (ad hoc) et zipper
        run: |
          APP=build/Build/Products/Release/Kumo.app
          codesign --force --deep --options runtime \
            --entitlements Kumo/Resources/Kumo.entitlements -s - "$APP"
          codesign --verify --deep --strict "$APP"
          ditto -c -k --keepParent "$APP" Kumo.zip
          # The same app as Compagnon.zip, for installs from before the new name: their
          # updater looks for that file (once updated, they install Kumo.app themselves)
          mkdir -p legacy && ditto "$APP" legacy/Compagnon.app
          ditto -c -k --keepParent legacy/Compagnon.app Compagnon.zip

      # Each green build of main becomes a release the app updates from.
      - name: Publier la release (mise à jour automatique)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          N=${{ github.run_number }}
          git log -1 --pretty=%B > notes.txt
          gh release create "build-$N" Kumo.zip Compagnon.zip --target "$GITHUB_SHA" \
            --title "Kumo — version $N" --notes-file notes.txt --latest
          # Keep the 10 most recent releases
          gh release list --limit 100 --json tagName --jq '.[10:][].tagName' \
            | while read -r tag; do gh release delete "$tag" --yes --cleanup-tag; done

      - uses: actions/upload-artifact@v4
        with:
          name: Kumo
          path: Kumo.zip
          retention-days: 30

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: build-log
          path: build.log
