name: Kumo
options:
  bundleIdPrefix: com.eldevtools
  deploymentTarget:
    macOS: "15.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "6.0"
    ENABLE_HARDENED_RUNTIME: YES
    OTHER_SWIFT_FLAGS: "-strict-concurrency=complete"
    # Signature locale (« ad hoc ») : l'app ne sert que sur notre Mac,
    # pas besoin de compte développeur Apple.
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: "-"
    CODE_SIGNING_REQUIRED: NO
    CODE_SIGNING_ALLOWED: YES
    CODE_SIGN_INJECT_BASE_ENTITLEMENTS: NO
    CODE_SIGN_ENTITLEMENTS: Resources/Kumo.entitlements

schemes:
  Kumo:
    build:
      targets:
        Kumo: all
    run:
      config: Debug
    archive:
      config: Release

targets:
  Kumo:
    type: application
    platform: macOS
    sources:
      - path: Sources
        type: group
      - path: Assets.xcassets
        buildPhase: resources
      - path: Resources/sounds
        buildPhase: resources
        type: folder
    info:
      path: Resources/Info.plist
      properties:
        CFBundleName: Kumo
        CFBundleDisplayName: Kumo
        # Kept from the app's first name: changing it would reset your settings and
        # macOS permissions. Never shown.
        CFBundleIdentifier: com.eldevtools.Compagnon
        # Set by CI from the build number (UpdateService compares it with the latest release)
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundlePackageType: APPL
        CFBundleDevelopmentRegion: fr
        LSUIElement: YES
        NSHighResolutionCapable: YES
        NSSupportsAutomaticGraphicsSwitching: YES
        NSAppleEventsUsageDescription: "Pour ramener au premier plan l’app où tourne Claude et piloter Spotify depuis l’encoche."
        NSCalendarsFullAccessUsageDescription: "Pour te prévenir quelques minutes avant tes réunions et te proposer de les rejoindre."
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.eldevtools.Compagnon
        PRODUCT_NAME: Kumo
        INFOPLIST_FILE: Resources/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        MACOSX_DEPLOYMENT_TARGET: "15.0"
        ENABLE_SANDBOX: NO
        DEVELOPMENT_LANGUAGE: fr
        CURRENT_PROJECT_VERSION: "0"
        MARKETING_VERSION: "0.1.0"
